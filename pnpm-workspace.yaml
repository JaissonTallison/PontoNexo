packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  argon2: true
  esbuild: true
  '@scarf/scarf': false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.9'
  - '@nestjs/common@12.2.0'
  - '@nestjs/core@12.2.0'
  - '@nestjs/platform-express@12.2.0'
  - '@nestjs/testing@12.2.0'
